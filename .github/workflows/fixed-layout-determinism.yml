name: Fixed-layout determinism

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  determinism:
    name: Fixed-layout determinism harness
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build plugin
        working-directory: plugin
        shell: pwsh
        run: |
          .\gradlew.bat clean shadowJar --no-daemon --console=plain

      - name: Install built plugin into test-server
        shell: pwsh
        run: |
          $src = Get-ChildItem -Path plugin\build\libs -Filter "village-overhaul*.jar" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $src) { Write-Error "No plugin JAR found"; exit 1 }
          $dst = Join-Path ${{ github.workspace }} 'test-server\plugins\VillageOverhaul.jar'
          Copy-Item -Path $src.FullName -Destination $dst -Force
          Write-Host "Copied plugin to: $dst"

      - name: Run fixed-layout determinism harness
        shell: pwsh
        env:
          CI: 'true'
        run: |
          # Use the provided harness which runs two isolated server runs
          .\scripts\ci\sim\test-fixed-layout-determinism.ps1 -Seed 12345 -FixedLayoutCount 3 -Ticks 300

      - name: Upload fixed-layout run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-layout-artifacts
          path: |
            test-server-fixed-1/artifacts/**
            test-server-fixed-1/logs/**
            test-server-fixed-2/artifacts/**
            test-server-fixed-2/logs/**
      - name: Run custom villager interaction test (T019r)
        shell: pwsh
        env:
          CI: 'true'
        run: |
          # Use smaller tick counts under CI to keep runs short
          .\scripts\ci\sim\test-custom-villager-interaction.ps1 -Ticks 300

      - name: Run NPC performance test (T019s)
        shell: pwsh
        env:
          CI: 'true'
        run: |
          # Keep a small, reproducible workload for CI
          .\scripts\ci\sim\test-npc-performance.ps1 -VillagerCount 5 -Ticks 300 -PerfProfile Medium