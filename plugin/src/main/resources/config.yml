# Village Overhaul Configuration
# ===================================
# Configure village generation, spacing, terrain handling, and debug options

# Village Generation Settings
village:
  # Minimum spacing between building footprints (blocks)
  # This prevents structures from being placed too close together
  # Default: 2 blocks (Constitution v1.5.0, Principle XII)
  minBuildingSpacing: 2
  
  # Minimum spacing between village borders (blocks)
  # Enforces border-to-border distance; prevents village overlap
  # First/early villages start near (not at) spawn; subsequent villages
  # placed as close as possible to existing borders while respecting this distance
  # Default: 200 blocks (Constitution v1.5.0, Principle XII)
  minVillageSpacing: 200
  
  # Maximum radius for spawn-proximal first village placement (blocks)
  # First village will be placed within this distance from world spawn
  # Set to 0 to disable spawn proximity bias
  # Default: 512 blocks (Constitution v1.5.0, Principle XII)
  spawnProximityRadius: 512

# World Generation (Worldgen) Settings
# T052a: Non-blocking seeding configuration
worldgen:
  seed:
    # Enable async terrain search and chunk loading
    # When true: Uses time-budgeted chunk loading to prevent main thread blocking
    # When false: Uses traditional synchronous chunk loading (may cause freeze)
    # Default: true (recommended for production)
    async: true
    
    # Maximum milliseconds to spend loading chunks during terrain search
    # Chunks beyond this budget are skipped (searched later or ignored)
    # Lower = less blocking, but may miss suitable sites
    # Higher = more thorough search, but more potential blocking
    # Range: 500-5000 (default: 2000)
    timeBudgetMs: 2000
    
    # Maximum milliseconds for structure placement chunk loading per search
    # Each placement candidate search will not exceed this budget
    # Lower = less blocking per structure, but may skip candidates
    # Higher = more thorough placement, but more blocking per structure
    # Range: 50-500 (default: 100)
    placementTimeBudgetMs: 100
        
  # Allow fallback marker pillar placement when zero-placement occurs
  # Default: false (zero-placement is treated as a failure and no pillar is placed)
  # Set to true to allow marker fallback without needing --allow-marker
  allowMarkerFallback: false

# Debug Flags
debug:
  # Enable verbose logging (FINE level) for detailed diagnostic output
  # When enabled, shows [STRUCT][RECEIPT], [STRUCT][VOLUME], [PATH] logs
  # and other fine-grained diagnostic messages
  # WARNING: Generates significant log volume - use only for debugging
  # Default: false
  verbose: false
  
  # Enable detailed tick engine logging
  tick: false
  
  # Enable structure placement debug logs
  structure: false
  
  # Enable path generation debug logs
  path: false
  
  # Enable async/blocking diagnostic logs (T052a)
  # When enabled, shows [TERRAIN][DIAG], [STRUCT][CHUNK-DIAG] logs
  # Useful for monitoring chunk loading behavior
  # Default: false
  asyncDiag: false
